<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#070d1d"/>
      <stop offset="80%" stop-color="#02040a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Outer Squircle Border Glow Gradient -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="85%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- T Gradients -->
    <linearGradient id="tTopBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="tTopHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="tStemFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <linearGradient id="tStemBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0"/>
    </linearGradient>

    <!-- F Gradients -->
    <linearGradient id="fFront" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="fTopFlare" x1="0%" y1="0%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="85%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>

    <linearGradient id="fMiddleBar" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="fPurpleShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Orbital Swoosh Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#60a5fa"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="90%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlowOuter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="swooshGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur1"/>
      <feGaussianBlur stdDeviation="3.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- 1. Ambient Background Glow Behind Icon -->
  <rect x="52" y="52" width="408" height="408" rx="100" fill="none" stroke="url(#squircleBorder)" stroke-width="12" opacity="0.45" filter="url(#neonGlowOuter)"/>

  <!-- 2. Dark Squircle Body -->
  <rect x="54" y="54" width="404" height="404" rx="98" fill="url(#bgGlow)"/>

  <!-- Glowing Borders -->
  <rect x="54" y="54" width="404" height="404" rx="98" fill="none" stroke="url(#squircleBorder)" stroke-width="4.5"/>
  <rect x="56" y="56" width="400" height="400" rx="96" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.6"/>

  <!-- 3. Ambient Lighting Glow Behind Monogram -->
  <circle cx="230" cy="245" r="140" fill="#0284c7" opacity="0.16" filter="url(#neonGlowOuter)"/>
  <circle cx="340" cy="275" r="110" fill="#a855f7" opacity="0.14" filter="url(#neonGlowOuter)"/>

  <!-- ========================================================= -->
  <!-- 4. MONOGRAM GROUP (TF) - CLEAN FINAL VERSION -->
  <!-- ========================================================= -->
  <g filter="url(#softShadow)">

    <!-- BACK PORTION OF ORBITAL SWOOSH (behind T) -->
    <path d="M 124 316 C 96 280 96 230 134 212 C 160 200 178 206 186 218" 
          stroke="url(#swooshGrad)" 
          stroke-width="14" 
          stroke-linecap="round" 
          opacity="0.9" 
          filter="url(#swooshGlow)"/>

    <!-- ========================================================= -->
    <!-- LETTER "T" -->
    <!-- ========================================================= -->
    <!-- T - Top Horizontal Bar 3D Body -->
    <path d="M 104 194 C 112 162 136 148 184 146 L 278 146 C 284 156 276 172 264 182 C 248 194 234 196 218 196 L 172 196 C 142 196 120 198 104 194 Z"
          fill="url(#tTopBar)"/>

    <!-- T - Top Bevel Highlight Sheen -->
    <path d="M 110 188 C 120 158 144 148 186 147 L 274 147 C 262 158 248 168 224 168 L 172 168 C 136 168 120 176 110 188 Z"
          fill="url(#tTopHighlight)"
          opacity="0.45"/>

    <!-- T - Vertical Stem -->
    <path d="M 170 196 L 218 196 L 218 360 C 218 376 198 392 178 386 C 172 384 170 374 170 364 L 170 196 Z"
          fill="url(#tStemFront)"/>

    <!-- T - Left Bevel Edge Highlight -->
    <path d="M 170 196 L 182 196 L 182 372 C 174 366 170 358 170 348 Z"
          fill="#67e8f9"
          opacity="0.75"/>

    <!-- T - Stem Inner 3D Gradient Overlay -->
    <path d="M 170 196 L 218 196 L 218 360 C 218 376 198 392 178 386 C 172 384 170 374 170 364 L 170 196 Z"
          fill="url(#tStemBevel)"/>

    <!-- ========================================================= -->
    <!-- LETTER "F" - CLEAN AERODYNAMIC WING (NO CAP) -->
    <!-- ========================================================= -->
    <!-- F - Main Sweeping 3D Body -->
    <path d="M 238 214 C 238 184 260 166 294 158 C 334 148 378 152 414 134 C 418 152 402 186 384 202 C 354 226 314 228 286 230 L 286 256 L 374 256 C 390 256 392 274 378 286 C 362 298 338 298 316 298 L 286 298 L 286 364 C 286 384 266 400 248 394 C 240 390 238 380 238 368 L 238 214 Z"
          fill="url(#fFront)"/>

    <!-- F - Top Swept Aerodynamic Wing Crest Highlight -->
    <path d="M 294 158 C 334 148 378 152 414 134 C 408 154 394 178 376 194 C 346 218 308 220 286 220 C 280 196 284 172 294 158 Z"
          fill="url(#fTopFlare)"/>

    <!-- F - Top Gloss Specular Highlight Line -->
    <path d="M 296 160 C 336 150 380 154 412 137 C 396 160 372 180 344 192 C 314 204 298 198 296 160 Z"
          fill="#ffffff"
          opacity="0.6"/>

    <!-- F - Middle Horizontal Bar Highlight -->
    <path d="M 286 256 L 374 256 C 390 256 392 274 378 286 C 362 298 338 298 316 298 L 286 298 Z"
          fill="url(#fMiddleBar)"/>

    <path d="M 286 258 L 370 258 C 382 260 384 270 374 278 L 286 278 Z"
          fill="#ffffff"
          opacity="0.35"/>

    <!-- F - Lower Stem Ambient Purple/Violet Reflection -->
    <path d="M 238 298 L 286 298 L 286 364 C 286 384 266 400 248 394 C 240 390 238 380 238 368 Z"
          fill="url(#fPurpleShade)"/>

    <!-- ========================================================= -->
    <!-- 5. FRONT PORTION OF ORBITAL SWOOSH -->
    <!-- ========================================================= -->
    <!-- Dynamic looping glowing ribbon crossing in front of T and looping around F -->
    <path d="M 104 274 C 120 220 180 236 244 286 C 298 326 348 358 376 344 C 392 334 394 308 372 284"
          stroke="url(#swooshGrad)" 
          stroke-width="14" 
          stroke-linecap="round" 
          fill="none"
          filter="url(#swooshGlow)"/>

    <!-- Inner Core White Hot Specular Line on Swoosh -->
    <path d="M 108 270 C 124 224 178 238 244 286 C 298 326 348 358 374 344 C 388 336 390 314 372 290"
          stroke="#ffffff" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          fill="none"
          opacity="0.9"/>
  </g>
</svg>
